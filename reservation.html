<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reserve - Casa Gracia's Hotel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Casa Gracia's Hotel & Resort Booking and Reservation" />
    <meta name="theme-color" content="#2f4a3c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Casa Gracia's" />
    <link rel="icon" type="image/png" href="/casa_gracias_hotel_192x192.png" />
    <link rel="apple-touch-icon" href="/casa_gracias_hotel_192x192.png" />
    <link rel="manifest" href="/manifest.json" />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-reservation.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('SW Registered:', reg.scope))
            .catch((err) => console.warn('SW Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
